[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbat"
version = "0.1.0"
description = "Pure Python network configuration analysis for Juniper firewalls"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
